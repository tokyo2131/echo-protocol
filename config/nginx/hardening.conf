# Managed by echo-protocol scripts/12-nginx-certbot.sh
# Installed as /etc/nginx/conf.d/00-hardening.conf

server_tokens off;

client_body_buffer_size 1K;
client_header_buffer_size 1k;
large_client_header_buffers 2 1k;

# Basic request-rate limiting zone; opt individual locations in with
# `limit_req zone=general burst=20 nodelay;` inside a vhost.
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

# Applied at the http{} level (this file loads for every server block,
# HTTP or HTTPS) rather than inside a per-vhost listen-443 block, since
# vhosts are deliberately HTTP-only until Certbot adds their HTTPS
# block itself — see config/nginx/reverse-proxy.conf.template. HSTS is
# a no-op over plain HTTP (browsers only honor it on HTTPS responses)
# and starts working the moment a vhost actually gets a certificate.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
