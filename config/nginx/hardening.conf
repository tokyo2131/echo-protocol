# Managed by echo-protocol scripts/12-nginx-certbot.sh
# Installed as /etc/nginx/conf.d/00-hardening.conf

server_tokens off;

client_body_buffer_size 1K;
client_header_buffer_size 1k;
large_client_header_buffers 2 1k;

# Basic request-rate limiting zone; opt individual locations in with
# `limit_req zone=general burst=20 nodelay;` inside a vhost.
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
