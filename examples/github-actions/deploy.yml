# Example CI/CD workflow for automatic deployments to this server.
# This belongs in an APPLICATION repo (e.g. Ruflo), not in echo-protocol
# itself — echo-protocol provisions the server; this deploys code to it.
# Copy to .github/workflows/deploy.yml in that repo and adjust image
# name / compose path.
#
# Flow: push to main -> build & push image to GHCR -> SSH to the
# droplet -> pull the new image -> `docker compose up -d` (zero-downtime
# for anything behind the healthcheck-gated depends_on in
# docker/docker-compose.example.yml).
#
# Required repo secrets:
#   DEPLOY_HOST        droplet IP or domain
#   DEPLOY_USER        the admin user created by scripts/00-bootstrap.sh
#   DEPLOY_SSH_KEY      private key matching that user's authorized_keys
#   DEPLOY_PROJECT_DIR e.g. /home/deploy/docker/app

name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "image=ghcr.io/${{ github.repository }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PROJECT_DIR }}"
            echo "IMAGE=${{ needs.build-and-push.outputs.image }}" > .env.deploy
            docker compose --env-file .env --env-file .env.deploy pull web
            docker compose --env-file .env --env-file .env.deploy up -d --remove-orphans
            docker image prune -f
