# Managed by echo-protocol scripts/01-ssh-hardening.sh
# Installed as /etc/ssh/sshd_config.d/99-hardening.conf
# (files in sshd_config.d/ are included by the default Debian 12
# sshd_config and are applied in filename order; 99- makes this last/authoritative)

# --- Authentication ---
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
AuthenticationMethods publickey
MaxAuthTries 3
LoginGraceTime 30

# --- Session hygiene ---
ClientAliveInterval 300
ClientAliveCountMax 2
TCPKeepAlive yes
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
MaxSessions 10
MaxStartups 10:30:60

# --- Cryptography (current best-practice algorithm sets) ---
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com

# --- Logging ---
LogLevel VERBOSE
SyslogFacility AUTH

# --- Misc ---
UseDNS no
Compression no
AllowTcpForwarding no
